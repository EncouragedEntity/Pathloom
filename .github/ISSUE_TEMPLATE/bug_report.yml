name: Bug report
description: Something in Pathloom (app, CLI or MCP server) does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The issue that you've encountered
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project with ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Where
      options:
        - Desktop app
        - CLI (pathloom)
        - MCP server (pathloom mcp)
        - Installer / update
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pathloom version and OS
      placeholder: 0.1.0, Windows 11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Logs, screenshots, plan files
      description: Attach what helps. Remove anything private from plan files first.
