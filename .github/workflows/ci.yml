# Manual only (Actions → CI → Run workflow) so private-repo minutes are not spent on every push.
# Switch `on:` to push/pull_request once the repository is public (public repos have free minutes).
name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Rust tests (core + CLI/MCP)
        run: cargo test -p pathloom-core -p pathloom-cli
      - name: Clippy
        run: cargo clippy -p pathloom-core -p pathloom-cli --all-targets -- -D warnings
      - name: Canvas tests
        run: npm run test -w @pathloom/canvas
      - name: Typecheck
        run: |
          npm run typecheck -w @pathloom/canvas
          npm run typecheck -w @pathloom/desktop
