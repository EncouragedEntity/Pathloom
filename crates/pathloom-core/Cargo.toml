[package]
name = "pathloom-core"
description = "Pathloom core: project files, boards, stages, dependency graph"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
serde-saphyr = "2"
thiserror = "2"
petgraph = "0.8"
tempfile = "3"
sha2 = "0.10"
schemars = "1"
ulid = "3"
