<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pathloom canvas harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0f0d16; --panel:#181524; --border:#2a2540; --text:#ece9f7; --muted:#7d769a; --accent:#9b87f5; --onAccent:#0f0d16; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font:13px Inter, system-ui, sans-serif; }
  #cv { position:fixed; inset:0; }
  #bar { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:4px; align-items:center; padding:6px; background:var(--panel); border:1px solid var(--border); border-radius:12px; z-index:20; box-shadow:0 8px 28px rgba(0,0,0,.3); }
  #bar button { all:unset; cursor:pointer; padding:6px 9px; border-radius:7px; color:var(--text); font-size:12px; white-space:nowrap; }
  #bar button:hover { background:color-mix(in srgb, var(--accent) 16%, transparent); }
  #bar button.on { background:var(--accent); color:var(--onAccent); }
  #bar .sep { width:1px; height:20px; background:var(--border); margin:0 4px; }
  #bar kbd { opacity:.55; font:10px 'JetBrains Mono', monospace; margin-left:4px; }
  #info { position:fixed; left:12px; bottom:12px; padding:6px 10px; background:var(--panel); border:1px solid var(--border); border-radius:8px; color:var(--muted); font:11px 'JetBrains Mono', monospace; z-index:20; max-width:70vw; }
  #fps { position:fixed; right:12px; bottom:12px; padding:6px 10px; background:var(--panel); border:1px solid var(--border); border-radius:8px; color:var(--muted); font:11px 'JetBrains Mono', monospace; z-index:20; white-space:pre; }
</style>
</head>
<body>
<div id="cv"></div>
<div id="bar"></div>
<div id="info"></div>
<div id="fps">fps -</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
